<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordonnance Mobile — Hôpital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../shared/om-core.js"></script></head><body><main><h1>Hôpital</h1><p id="state">Chargement…</p><div id="rdv"></div></main><script>
const sb=OM.sb,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let me,rows=[];
async function load(){me=await OM.user();if(!me){$('state').textContent='Non connecté';return}const p=(await sb.from('profiles').select('*').eq('id',me.id).single()).data;if(!p?.hopital_id){$('state').textContent='Compte hospitalier non rattaché';return}$('state').textContent=`Hôpital #${p.hopital_id}`;await refresh();OM.subscribe('hospital-flow',['rendez_vous','ordonnances'],refresh)}
async function refresh(){const p=(await sb.from('profiles').select('hopital_id').eq('id',me.id).single()).data;rows=(await sb.from('rendez_vous').select('*,patients(nom,prenom,telephone),constantes(*),ordonnances(*,ordonnance_lignes(*))').eq('hopital_id',p.hopital_id).order('created_at',{ascending:false})).data||[];$('rdv').innerHTML=rows.map(r=>`<article><b>${esc(r.patients?.nom)} ${esc(r.patients?.prenom)}</b> — ${esc(r.specialite)} — ${esc(r.statut)}<br>Constantes: ${r.constantes?.length?'prises':'à prendre'} ${r.ordonnances?' — ordonnance créée':''}<br>${r.statut==='attente'?`<button onclick="constantes(${r.id})">Envoyer au médecin</button>`:''}${r.statut==='constantes'?`<button onclick="ord(${r.id})">Créer ordonnance</button>`:''}</article>`).join('')||'Aucun rendez-vous'}
async function constantes(id){const r=await sb.from('constantes').insert({rendez_vous_id:id,temperature:37,tension:'120/80',poids:70,saisi_par:me.id});if(r.error)return alert(r.error.message);await sb.from('rendez_vous').update({statut:'constantes'}).eq('id',id);refresh()}
async function ord(id){const r=rows.find(x=>x.id===id);const o=await sb.from('ordonnances').insert({rendez_vous_id:id,patient_id:r.patient_id,hopital_id:r.hopital_id,medecin_id:me.id,signature:me.email||'Médecin'}).select().single();if(o.error)return alert(o.error.message);const l=await sb.from('ordonnance_lignes').insert({ordonnance_id:o.data.id,medicament:'Paracétamol',posologie:'Selon prescription'});if(l.error)return alert(l.error.message);await sb.from('rendez_vous').update({statut:'termine',medecin_id:me.id}).eq('id',id);refresh()}load();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordonnance Mobile — Hôpital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../shared/om-core.js"></script><style>body{font-family:system-ui;max-width:1100px;margin:auto;padding:24px;background:#f5f7fb}article{background:#fff;margin:12px 0;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}input,button{padding:9px;margin:4px}button{cursor:pointer}</style></head><body><main><h1>Hôpital</h1><p id="state">Chargement…</p><div id="rdv"></div></main><script>
const sb=OM.sb,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me,rows=[];
async function load(){me=await OM.user();if(!me){$('state').textContent='Non connecté';return}const p=(await sb.from('profiles').select('hopital_id,role').eq('id',me.id).single()).data;if(!p?.hopital_id){$('state').textContent='Compte hospitalier non rattaché';return}$('state').textContent=`Hôpital #${p.hopital_id}`;await refresh();OM.subscribe('hospital-flow',['rendez_vous','ordonnances','constantes'],refresh)}
async function refresh(){const p=(await sb.from('profiles').select('hopital_id').eq('id',me.id).single()).data;rows=(await sb.from('rendez_vous').select('*,patients(nom,prenom,telephone),constantes(*),ordonnances(*,ordonnance_lignes(*))').eq('hopital_id',p.hopital_id).order('created_at',{ascending:false})).data||[];$('rdv').innerHTML=rows.map(r=>card(r)).join('')||'<p>Aucun rendez-vous.</p>'}
function card(r){const c=r.constantes?.[0],o=r.ordonnances?.[0];return `<article><b>${esc(r.patients?.nom)} ${esc(r.patients?.prenom)}</b> — ${esc(r.specialite)} — <strong>${esc(r.statut)}</strong><br>Tél: ${esc(r.patients?.telephone)}<br>Constantes: ${c?`${esc(c.temperature)} °C · ${esc(c.tension)} · ${esc(c.poids)} kg`:'à prendre'}${o?`<br>Ordonnance #${o.id}: ${(o.ordonnance_lignes||[]).map(x=>esc(x.medicament)).join(', ')}`:''}<div>${r.statut==='attente'?`<button onclick="constantes(${r.id})">Saisir constantes</button>`:''}${r.statut==='constantes'?`<button onclick="ord(${r.id})">Créer ordonnance</button>`:''}</div></article>`}
async function constantes(id){const temperature=prompt('Température (°C)','37');if(temperature===null)return;const tension=prompt('Tension','120/80');if(tension===null)return;const poids=prompt('Poids (kg)','70');if(poids===null)return;const r=await sb.from('constantes').insert({rendez_vous_id:id,temperature:Number(temperature),tension,poids:Number(poids),saisi_par:me.id});if(r.error)return alert(r.error.message);const u=await sb.from('rendez_vous').update({statut:'constantes'}).eq('id',id);if(u.error)return alert(u.error.message);refresh()}
async function ord(id){const r=rows.find(x=>x.id===id);if(!r)return;const medicament=prompt('Médicament','Paracétamol');if(!medicament)return;const posologie=prompt('Posologie','Selon prescription');if(!posologie)return;const o=await sb.from('ordonnances').insert({rendez_vous_id:id,patient_id:r.patient_id,hopital_id:r.hopital_id,medecin_id:me.id,signature:me.email||'Médecin'}).select().single();if(o.error)return alert(o.error.message);const l=await sb.from('ordonnance_lignes').insert({ordonnance_id:o.data.id,medicament,posologie});if(l.error){await sb.from('ordonnances').delete().eq('id',o.data.id);return alert(l.error.message)}const u=await sb.from('rendez_vous').update({statut:'termine',medecin_id:me.id}).eq('id',id);if(u.error)return alert(u.error.message);refresh()}load();</script></body></html>

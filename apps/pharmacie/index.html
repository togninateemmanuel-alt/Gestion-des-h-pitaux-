<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ordonnance Mobile — Pharmacie</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../shared/om-core.js"></script>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg: #f0fdf4;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #d1fae5;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .app { max-width: 520px; margin: 0 auto; padding: 0 16px 100px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      background: white;
    }
    .search-bar input:focus { outline: none; border-color: var(--primary); }
    section { margin-bottom: 28px; }
    section h2 {
      font-size: 1.05rem;
      font-weight: 650;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .see-all { font-size: 0.8rem; color: var(--primary); font-weight: 500; }
    .order-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .order-product { font-weight: 650; }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .badge-wait { background: #fef3c7; color: #92400e; }
    .badge-done { background: #dcfce7; color: #166534; }
    .order-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 0.85rem; }
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .product-card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .product-img {
      width: 100%;
      height: 90px;
      background: #ecfdf5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .product-name { font-weight: 650; font-size: 0.9rem; line-height: 1.3; }
    .product-detail { font-size: 0.75rem; color: var(--muted); margin: 2px 0 6px; }
    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }
    .price { font-weight: 700; color: var(--primary); font-size: 0.95rem; }
    .stock-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .stock-ok { background: #dcfce7; color: #166534; }
    .stock-low { background: #fef3c7; color: #92400e; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px 12px;
      font-size: 0.9rem;
      grid-column: 1 / -1;
    }
    .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      max-width: 520px;
      margin: 0 auto;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      color: var(--muted);
      text-decoration: none;
    }
    .nav-item.active { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <div class="logo-icon">+</div>
        <span>Pharmacie</span>
      </div>
    </header>

    <p class="status" id="state">Chargement…</p>

    <div class="search-bar">
      <input type="search" id="search" placeholder="Rechercher un médicament…" oninput="filterStock()">
    </div>

    <section>
      <h2>Commandes en attente <span class="see-all">Voir tout</span></h2>
      <div id="orders"></div>
    </section>

    <section>
      <h2>Catalogue produits <span class="see-all">Voir tout</span></h2>
      <div id="stock" class="product-grid"></div>
    </section>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item active" href="#"><span>🏠</span>Accueil</a>
    <a class="nav-item" href="#"><span>📋</span>Commandes</a>
    <a class="nav-item" href="#"><span>📦</span>Stock</a>
    <a class="nav-item" href="#"><span>👤</span>Compte</a>
  </nav>

  <script>
    const sb = OM.sb;
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&','<':'<','>':'>'}[c]));
    let me, ph, allStock = [];

    async function load() {
      me = await OM.user();
      if (!me) { $('state').textContent = 'Non connecté'; return; }
      const p = (await sb.from('profiles').select('*').eq('id', me.id).single()).data;
      if (!p?.pharmacie_id) { $('state').textContent = 'Compte pharmacie non rattaché'; return; }
      ph = p.pharmacie_id;
      $('state').textContent = `Pharmacie #${ph} · Connecté`;
      await refresh();
      OM.subscribe('pharmacy-flow', ['commandes_pharmacie', 'produits_pharmacie'], refresh);
    }

    async function refresh() {
      const [o, s] = await Promise.all([
        sb.from('commandes_pharmacie').select('*').eq('pharmacie_id', ph).order('id', {ascending: false}),
        sb.from('produits_pharmacie').select('*').eq('pharmacie_id', ph).order('nom')
      ]);
      const orders = o.data || [];
      allStock = s.data || [];

      $('orders').innerHTML = orders.length ? orders.map(x => `
        <div class="order-card">
          <div class="order-header">
            <div class="order-product">${esc(x.produit)}</div>
            <span class="badge ${x.statut === 'en_attente' ? 'badge-wait' : 'badge-done'}">${esc(x.statut)}</span>
          </div>
          <div class="order-meta">
            ${x.montant ? x.montant + ' € · ' : ''}
            ${x.ordonnance_id ? 'Ordonnance #' + x.ordonnance_id : 'Commande libre'}
          </div>
          ${x.statut === 'en_attente' ? `<button class="btn btn-primary" onclick="deliver(${x.id})">✓ Délivrer</button>` : ''}
        </div>`).join('') : '<div class="empty">Aucune commande en attente</div>';

      renderStock(allStock);
    }

    function renderStock(list) {
      $('stock').innerHTML = list.length ? list.map(x => {
        const low = (x.quantite || 0) < 10;
        return `
          <div class="product-card">
            <div class="product-img">💊</div>
            <div class="product-name">${esc(x.nom)}</div>
            <div class="product-detail">${x.quantite || 0} en stock</div>
            <div class="product-footer">
              <span class="price">${x.prix ? x.prix + ' €' : '—'}</span>
              <span class="stock-badge ${low ? 'stock-low' : 'stock-ok'}">${low ? 'Stock faible' : 'En stock'}</span>
            </div>
          </div>`;
      }).join('') : '<div class="empty">Stock vide</div>';
    }

    function filterStock() {
      const q = ($('search').value || '').toLowerCase().trim();
      if (!q) return renderStock(allStock);
      renderStock(allStock.filter(x => (x.nom || '').toLowerCase().includes(q)));
    }

    async function deliver(id) {
      const r = await sb.rpc('delivrer_commande', {p_commande: id});
      if (r.error) alert(r.error.message);
      refresh();
    }

    load();
  </script>
</body>
</html>

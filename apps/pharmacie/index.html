<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordonnance Mobile — Pharmacie</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../shared/om-core.js"></script></head><body><main><h1>Pharmacie</h1><p id="state">Chargement…</p><div id="orders"></div><h2>Stock</h2><div id="stock"></div></main><script>
const sb=OM.sb,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let me,ph;
async function load(){me=await OM.user();if(!me){$('state').textContent='Non connecté';return}const p=(await sb.from('profiles').select('*').eq('id',me.id).single()).data;if(!p?.pharmacie_id){$('state').textContent='Compte pharmacie non rattaché';return}ph=p.pharmacie_id;$('state').textContent=`Pharmacie #${ph}`;await refresh();OM.subscribe('pharmacy-flow',['commandes_pharmacie','produits_pharmacie'],refresh)}
async function refresh(){const [o,s]=await Promise.all([sb.from('commandes_pharmacie').select('*').eq('pharmacie_id',ph).order('id',{ascending:false}),sb.from('produits_pharmacie').select('*').eq('pharmacie_id',ph).order('nom')]);$('orders').innerHTML=(o.data||[]).map(x=>`<article><b>${esc(x.produit)}</b> — ${esc(x.statut)} — ${x.montant} <small>${x.ordonnance_id?`ordonnance #${x.ordonnance_id}`:'commande libre'}</small><button onclick="deliver(${x.id})">Délivrer</button></article>`).join('')||'Aucune commande';$('stock').innerHTML=(s.data||[]).map(x=>`<article>${esc(x.nom)} — ${x.quantite}</article>`).join('')||'Stock vide'}
async function deliver(id){const r=await sb.rpc('delivrer_commande',{p_commande:id});if(r.error)alert(r.error.message);refresh()}load();</script></body></html>

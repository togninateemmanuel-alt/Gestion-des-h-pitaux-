<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordonnance Mobile — Patient</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../shared/om-core.js"></script></head><body><main><h1>Patient</h1><p id="state">Connexion…</p><section><h2>Prendre rendez-vous</h2><select id="h"></select><input id="s" placeholder="Spécialité"><input id="x" placeholder="Symptômes"><button id="book">Réserver</button></section><section><h2>Mes ordonnances</h2><div id="ord"></div></section><section><h2>Mes commandes pharmacie</h2><div id="cmd"></div></section></main><script>
const sb=OM.sb;let user,patient,hosp=[],ords=[],cmds=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){user=await OM.user();if(!user){$('state').textContent='Non connecté — connectez-vous via votre interface Auth Supabase.';return}let r=await sb.from('patients').select('*').eq('user_id',user.id).single();patient=r.data;if(!patient){$('state').textContent='Profil patient introuvable';return}hosp=(await sb.from('hopitaux').select('*').eq('publie',true).order('nom')).data||[];$('h').innerHTML=hosp.map(h=>`<option value="${h.id}">${esc(h.nom)}</option>`).join('');await refresh();OM.subscribe('patient-flow',['rendez_vous','ordonnances','commandes_pharmacie'],refresh)}
async function refresh(){if(!patient)return;ords=(await sb.from('ordonnances').select('*,ordonnance_lignes(*),hopitaux(nom)').eq('patient_id',patient.id).order('id',{ascending:false})).data||[];cmds=(await sb.from('commandes_pharmacie').select('*').eq('patient_id',patient.id).order('id',{ascending:false})).data||[];$('ord').innerHTML=ords.map(o=>`<article><b>Ordonnance #${o.id}</b> — ${esc(o.hopitaux?.nom)}</article>`).join('')||'Aucune';$('cmd').innerHTML=cmds.map(c=>`<article>${esc(c.produit)} — ${esc(c.statut)} ${c.ordonnance_id?`(ordonnance #${c.ordonnance_id})`:''}</article>`).join('')||'Aucune'}
$('book').onclick=async()=>{const h=hosp.find(x=>x.id==$('h').value);const r=await sb.from('rendez_vous').insert({patient_id:patient.id,hopital_id:h.id,specialite:$('s').value,symptomes:$('x').value||$('s').value,montant:h.prix_consultation,mode_paiement:'Espèces'}).select().single();if(r.error)alert(r.error.message);else alert('Rendez-vous créé');refresh()};load();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordonnance Mobile — Patient</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../shared/om-core.js"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}main{max-width:1000px;margin:auto;padding:24px}section,article{background:#fff;border:1px solid #e4e8f0;border-radius:14px;padding:16px;margin:14px 0}button{padding:9px 13px;border:0;border-radius:8px;background:#14213d;color:#fff}select,input{padding:9px;margin:5px;border:1px solid #ccd3df;border-radius:8px}.muted{color:#667085}</style></head><body><main><h1>Patient</h1><p id="state">Connexion…</p><section><h2>Prendre rendez-vous</h2><select id="h"></select><input id="s" placeholder="Spécialité"><input id="x" placeholder="Symptômes"><button id="book">Réserver</button></section><section><h2>Mes ordonnances</h2><div id="ord"></div></section><section><h2>Commander en pharmacie</h2><p class="muted">Pour chaque médicament prescrit, l’application cherche automatiquement un stock disponible et rattache la commande à l’ordonnance.</p><div id="pharm"></div></section><section><h2>Mes commandes pharmacie</h2><div id="cmd"></div></section></main><script>
const sb=OM.sb;let user,patient,hosp=[],ords=[],cmds=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){user=await OM.user();if(!user){$('state').textContent='Non connecté — connectez-vous via votre interface Auth Supabase.';return}let r=await sb.from('patients').select('*').eq('user_id',user.id).single();patient=r.data;if(!patient){$('state').textContent='Profil patient introuvable';return}hosp=(await sb.from('hopitaux').select('*').eq('publie',true).order('nom')).data||[];$('h').innerHTML=hosp.map(h=>`<option value="${h.id}">${esc(h.nom)}</option>`).join('');await refresh();OM.subscribe('patient-flow',['rendez_vous','ordonnances','commandes_pharmacie'],refresh)}
async function refresh(){if(!patient)return;const [o,c]=await Promise.all([sb.from('ordonnances').select('*,ordonnance_lignes(*),hopitaux(nom)').eq('patient_id',patient.id).order('id',{ascending:false}),sb.from('commandes_pharmacie').select('*,pharmacies(nom)').eq('patient_id',patient.id).order('id',{ascending:false})]);ords=o.data||[];cmds=c.data||[];$('ord').innerHTML=ords.map(o=>`<article><b>Ordonnance #${o.id}</b> — ${esc(o.hopitaux?.nom)}<br>${(o.ordonnance_lignes||[]).map(l=>`<div>${esc(l.medicament)} — ${esc(l.posologie||'')} ${cmds.some(c=>c.ligne_id===l.id)?'<span class="muted">(commandé)</span>':''}</div>`).join('')}</article>`).join('')||'Aucune';$('pharm').innerHTML=ords.flatMap(o=>(o.ordonnance_lignes||[]).map(l=>({o,l}))).filter(z=>!cmds.some(c=>c.ligne_id===z.l.id)).map(z=>`<article><b>${esc(z.l.medicament)}</b><br><button onclick="orderDrug(${z.o.id},${z.l.id},${JSON.stringify(z.l.medicament)})">Chercher et commander</button></article>`).join('')||'Aucun médicament en attente de commande';$('cmd').innerHTML=cmds.map(c=>`<article>${esc(c.produit)} — ${esc(c.statut)} ${c.pharmacies?.nom?`— ${esc(c.pharmacies.nom)}`:''} ${c.ordonnance_id?`(ordonnance #${c.ordonnance_id})`:''}</article>`).join('')||'Aucune'}
async function orderDrug(ordonnanceId,ligneId,medicament){const q=String(medicament||'').trim();if(!q)return;const {data:products,error}=await sb.from('produits_pharmacie').select('id,nom,prix,quantite,pharmacie_id').ilike('nom','%'+q+'%').gt('quantite',0).limit(20);if(error||!products?.length)return alert('Aucun stock disponible pour '+q+'.');const x=products[0];const r=await sb.from('commandes_pharmacie').insert({ligne_id:ligneId,ordonnance_id:ordonnanceId,patient_id:patient.id,pharmacie_id:x.pharmacie_id,produit:x.nom,montant:x.prix,mode_paiement:'Espèces',statut:'en_attente'}).select().single();if(r.error)return alert(r.error.message);alert('Commande créée. Rendez-vous à la pharmacie pour le paiement en espèces.');refresh()}
$('book').onclick=async()=>{const h=hosp.find(x=>x.id==$('h').value);if(!h)return alert('Aucun hôpital disponible.');const r=await sb.from('rendez_vous').insert({patient_id:patient.id,hopital_id:h.id,specialite:$('s').value,symptomes:$('x').value||$('s').value,montant:h.prix_consultation,mode_paiement:'Espèces'}).select().single();if(r.error)alert(r.error.message);else alert('Rendez-vous créé');refresh()};load();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordonnance Mobile — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../shared/om-core.js"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#14213d;color:#fff;padding:22px}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:14px;padding:18px;margin-bottom:14px}.num{font-size:30px;font-weight:800}.muted{color:#667085}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.split{grid-template-columns:1fr}}button{padding:10px 14px;border:0;border-radius:9px;background:#14213d;color:white}.item{padding:10px 0;border-bottom:1px solid #eee}</style></head><body><header><h1>Dashboard Admin</h1><div id="state">Chargement…</div></header><main><section class="grid" id="stats"></section><section class="split"><div class="card"><h2>Demandes Hôpital</h2><div id="hRequests" class="muted">Chargement…</div></div><div class="card"><h2>Demandes Pharmacie</h2><div id="phRequests" class="muted">Chargement…</div></div></section><section class="split"><div class="card"><h2>Alertes</h2><div id="alerts">Chargement…</div></div><div class="card"><h2>Analyse IA</h2><p class="muted">L’IA analyse des agrégats administratifs, pas les dossiers individuels.</p><button id="runAi">Lancer l’analyse IA</button><div id="ai"></div></div></section><div class="card"><h2>Activité récente</h2><div id="activity" class="muted">Chargement…</div></div></main><script>
const sb=OM.sb,$=id=>document.getElementById(id);const names={hopitaux:'Hôpitaux',pharmacies:'Pharmacies',patients:'Patients',rendez_vous:'Rendez-vous',ordonnances:'Ordonnances',commandes_pharmacie:'Commandes pharmacie'};async function count(t){const r=await sb.from(t).select('id',{count:'exact',head:true});return r.error?null:r.count||0}async function list(t,id){const r=await sb.from(t).select('*').order('created_at',{ascending:false}).limit(8);$(id).innerHTML=r.error?'<span class="muted">Données indisponibles.</span>':(r.data||[]).map(x=>'<div class="item"><strong>'+(x.nom||x.name||x.etablissement||'Demande')+'</strong><br><span class="muted">Statut : '+(x.statut||x.status||'à vérifier')+'</span></div>').join('')||'Aucune demande.'}async function run(){const u=await OM.user();if(!u){$('state').textContent='Non connecté';return}const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.error||!p.data||!['admin','superadmin'].includes(p.data.role)){$('state').textContent='Accès administrateur requis';return}$('state').textContent='Administration active';const e=await Promise.all(Object.keys(names).map(async t=>[t,await count(t)]));const m=Object.fromEntries(e);$('stats').innerHTML=Object.entries(names).map(([k,v])=>'<div class="card"><div class="muted">'+v+'</div><div class="num">'+(m[k]??'—')+'</div></div>').join('');$('alerts').innerHTML='<div class="item">'+m.rendez_vous+' rendez-vous enregistrés.</div><div class="item">'+m.ordonnances+' ordonnances enregistrées.</div><div class="item">'+m.commandes_pharmacie+' commandes pharmacie.</div>';await Promise.all([list('hopitaux','hRequests'),list('pharmacies','phRequests')]);const r=await sb.from('rendez_vous').select('id,statut,created_at').order('created_at',{ascending:false}).limit(6);$('activity').innerHTML=r.error?'Données indisponibles.':(r.data||[]).map(x=>'<div class="item">Rendez-vous '+x.id+' — '+(x.statut||'état non renseigné')+'</div>').join('')||'Aucune activité.'}async function runAI(){$('ai').textContent='Analyse en cours…';const r=await sb.functions.invoke('admin-ai-insights',{body:{}});if(r.error){$('ai').textContent='Erreur IA : '+r.error.message;return}if(!r.data.ai_enabled){$('ai').textContent=r.data.message;return}const i=r.data.insights||{};$('ai').innerHTML='<p><strong>Synthèse :</strong> '+(i.summary||'Aucune synthèse.')+'</p>'+(Array.isArray(i.alerts)?i.alerts.map(a=>'<div class="item"><strong>'+a.title+'</strong> — '+(a.detail||'')+'</div>').join(''):'')+(Array.isArray(i.recommendations)?'<ul>'+i.recommendations.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'')}$('runAi').onclick=runAI;run();</script></body></html>

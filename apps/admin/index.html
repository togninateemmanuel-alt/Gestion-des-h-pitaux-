<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordonnance Mobile — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../shared/om-core.js"></script></head><body><main><h1>Dashboard Admin</h1><p id="state">Chargement…</p><div id="stats"></div></main><script>
const sb=OM.sb,$=id=>document.getElementById(id);async function load(){const u=await OM.user();if(!u){$('state').textContent='Non connecté';return}const p=(await sb.from('profiles').select('role').eq('id',u.id).single()).data;if(!p||!['admin','superadmin'].includes(p.role)){$('state').textContent='Accès administrateur requis';return}$('state').textContent='Administration active';const [h,ph,pa,rd,ord,cmd]=await Promise.all([sb.from('hopitaux').select('id',{count:'exact',head:true}),sb.from('pharmacies').select('id',{count:'exact',head:true}),sb.from('patients').select('id',{count:'exact',head:true}),sb.from('rendez_vous').select('id',{count:'exact',head:true}),sb.from('ordonnances').select('id',{count:'exact',head:true}),sb.from('commandes_pharmacie').select('id',{count:'exact',head:true})]);$('stats').innerHTML=`<ul><li>Hôpitaux: ${h.count||0}</li><li>Pharmacies: ${ph.count||0}</li><li>Patients: ${pa.count||0}</li><li>Rendez-vous: ${rd.count||0}</li><li>Ordonnances: ${ord.count||0}</li><li>Commandes pharmacie: ${cmd.count||0}</li></ul>`}load();</script></body></html>
